<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BECE Social Learning Network — Dashboard</title>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0f1117;
            --bg-secondary: #1a1d2e;
            --bg-card: #1e2235;
            --bg-card-hover: #252a40;
            --border: #2a2f45;
            --text-primary: #e8eaf0;
            --text-secondary: #8b8fa3;
            --text-muted: #5f6377;
            --accent-blue: #4f8ff7;
            --accent-green: #34d399;
            --accent-red: #f87171;
            --accent-orange: #fb923c;
            --accent-purple: #a78bfa;
            --accent-cyan: #22d3ee
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh
        }

        .app {
            display: flex;
            min-height: 100vh
        }

        .sidebar {
            width: 240px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border);
            padding: 24px 0;
            position: fixed;
            height: 100vh;
            display: flex;
            flex-direction: column
        }

        .sidebar-logo {
            padding: 0 24px 24px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 16px
        }

        .sidebar-logo h1 {
            font-size: 18px;
            font-weight: 700;
            color: var(--accent-blue);
            letter-spacing: -0.5px
        }

        .sidebar-logo p {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 4px;
            text-transform: uppercase;
            letter-spacing: 1px
        }

        .nav-item {
            padding: 10px 24px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
            transition: all 0.2s;
            border-left: 3px solid transparent
        }

        .nav-item:hover {
            color: var(--text-primary);
            background: var(--bg-card)
        }

        .nav-item.active {
            color: var(--accent-blue);
            background: rgba(79, 143, 247, 0.08);
            border-left-color: var(--accent-blue)
        }

        .nav-item .nav-icon {
            margin-right: 10px
        }

        .sidebar-footer {
            margin-top: auto;
            padding: 16px 24px;
            border-top: 1px solid var(--border);
            font-size: 11px;
            color: var(--text-muted)
        }

        .main-content {
            margin-left: 240px;
            flex: 1;
            padding: 32px;
            min-height: 100vh
        }

        .page-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.5px
        }

        .page-subtitle {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 28px
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 28px
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            transition: transform 0.2s, border-color 0.2s
        }

        .stat-card:hover {
            transform: translateY(-2px);
            border-color: var(--accent-blue)
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 8px
        }

        .stat-value {
            font-size: 28px;
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace
        }

        .stat-detail {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 4px
        }

        .charts-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 28px
        }

        .chart-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px
        }

        .chart-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 16px;
            color: var(--text-primary)
        }

        .table-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 20px
        }

        .table-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
            font-weight: 600
        }

        table {
            width: 100%;
            border-collapse: collapse
        }

        th {
            text-align: left;
            padding: 10px 20px;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border);
            font-weight: 600
        }

        td {
            padding: 12px 20px;
            font-size: 13px;
            border-bottom: 1px solid rgba(42, 47, 69, 0.5)
        }

        tr:hover {
            background: var(--bg-card-hover)
        }

        .score-bar-bg {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 3px;
            overflow: hidden
        }

        .score-bar {
            height: 100%;
            border-radius: 3px;
            transition: width 0.6s ease
        }

        .badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.3px
        }

        .badge-easy {
            background: rgba(52, 211, 153, 0.15);
            color: var(--accent-green)
        }

        .badge-medium {
            background: rgba(251, 146, 60, 0.15);
            color: var(--accent-orange)
        }

        .badge-hard {
            background: rgba(248, 113, 113, 0.15);
            color: var(--accent-red)
        }

        .badge-strong {
            background: rgba(79, 143, 247, 0.15);
            color: var(--accent-blue)
        }

        .badge-average {
            background: rgba(251, 146, 60, 0.15);
            color: var(--accent-orange)
        }

        .badge-struggling {
            background: rgba(248, 113, 113, 0.15);
            color: var(--accent-red)
        }

        .badge-mixed {
            background: rgba(167, 139, 250, 0.15);
            color: var(--accent-purple)
        }

        .pair-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 10px;
            transition: border-color 0.2s
        }

        .pair-card:hover {
            border-color: var(--accent-purple)
        }

        .pair-rank {
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            font-weight: 700;
            color: var(--text-muted);
            width: 28px
        }

        .pair-students {
            flex: 1
        }

        .pair-score {
            font-family: 'JetBrains Mono', monospace;
            font-size: 16px;
            font-weight: 700;
            color: var(--accent-purple)
        }

        .group-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 12px
        }

        .group-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px
        }

        .group-id {
            font-weight: 700;
            font-size: 16px;
            color: var(--accent-cyan)
        }

        .group-members {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 10px
        }

        .member-tag {
            background: rgba(79, 143, 247, 0.12);
            color: var(--accent-blue);
            padding: 4px 10px;
            border-radius: 6px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            font-weight: 500
        }

        .group-meta {
            font-size: 12px;
            color: var(--text-secondary)
        }

        .loading {
            text-align: center;
            padding: 60px;
            color: var(--text-muted)
        }

        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid var(--border);
            border-top-color: var(--accent-blue);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px
        }

        @keyframes spin {
            to {
                transform: rotate(360deg)
            }
        }

        .error-box {
            background: rgba(248, 113, 113, 0.1);
            border: 1px solid rgba(248, 113, 113, 0.3);
            border-radius: 12px;
            padding: 20px;
            color: var(--accent-red);
            text-align: center
        }

        .css-chart {
            display: flex;
            flex-direction: column;
            gap: 10px
        }

        .css-bar-row {
            display: flex;
            align-items: center;
            gap: 12px
        }

        .css-bar-label {
            font-size: 12px;
            color: var(--text-secondary);
            width: 140px;
            text-align: right;
            flex-shrink: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap
        }

        .css-bar-track {
            flex: 1;
            height: 22px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 6px;
            overflow: hidden
        }

        .css-bar-fill {
            height: 100%;
            border-radius: 6px;
            transition: width 0.8s ease;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 8px
        }

        .css-bar-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.9)
        }
    </style>
</head>

<body>
    <div class="app">
        <nav class="sidebar">
            <div class="sidebar-logo">
                <h1>BECE SLN</h1>
                <p>Social Learning Network</p>
            </div>
            <div class="nav-item active" onclick="showPage('overview',this)"><span class="nav-icon">📊</span> Overview
            </div>
            <div class="nav-item" onclick="showPage('students',this)"><span class="nav-icon">👥</span> Students</div>
            <div class="nav-item" onclick="showPage('topics',this)"><span class="nav-icon">📚</span> Topics</div>
            <div class="nav-item" onclick="showPage('pairs',this)"><span class="nav-icon">🤝</span> Peer Pairs</div>
            <div class="nav-item" onclick="showPage('groups',this)"><span class="nav-icon">👨‍👩‍👧‍👦</span> Study
                Groups</div>
            <div class="nav-item" onclick="showPage('dependencies',this)"><span class="nav-icon">🔗</span> Dependencies
            </div>
            <div class="sidebar-footer">Redeemer's University, Ede<br>BSc Information Technology<br>Supervisor: Dr. T.
                V. Igbe</div>
        </nav>
        <main class="main-content" id="mc">
            <div class="loading">
                <div class="spinner"></div>Loading dashboard...
            </div>
        </main>
    </div>
    <script>
        const API = "http://localhost:5000/api"; let cache = {};
        function showPage(p, el) { document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active')); if (el) el.classList.add('active'); ({ overview: renderOverview, students: renderStudents, topics: renderTopics, pairs: renderPairs, groups: renderGroups, dependencies: renderDependencies })[p]() }
        async function api(e) { if (cache[e]) return cache[e]; try { const r = await fetch(API + e); const d = await r.json(); cache[e] = d; return d } catch (x) { return null } }
        function sc(s) { return s >= .7 ? 'var(--accent-green)' : s >= .5 ? 'var(--accent-orange)' : 'var(--accent-red)' }
        function db(d) { return '<span class="badge badge-' + d.toLowerCase() + '">' + d + '</span>' }
        function pb(p) { return '<span class="badge badge-' + p + '">' + p + '</span>' }
        function sb(s) { return '<div style="display:flex;align-items:center;gap:10px"><span style="font-family:JetBrains Mono;font-size:13px;width:40px;color:' + sc(s) + '">' + (s * 100).toFixed(0) + '%</span><div class="score-bar-bg" style="flex:1"><div class="score-bar" style="width:' + (s * 100) + '%;background:' + sc(s) + '"></div></div></div>' }
        function barChart(items, colorFn) { return '<div class="css-chart">' + items.map(i => { const p = (i.value * 100).toFixed(1); const c = colorFn ? colorFn(i.value) : sc(i.value); return '<div class="css-bar-row"><div class="css-bar-label" title="' + i.label + '">' + i.label + '</div><div class="css-bar-track"><div class="css-bar-fill" style="width:' + p + '%;background:' + c + '"><span class="css-bar-value">' + p + '%</span></div></div></div>' }).join('') + '</div>' }

        async function renderOverview() {
            const d = await api('/dashboard'); if (!d) { document.getElementById('mc').innerHTML = '<div class="error-box">Cannot connect to API. Is Flask running?</div>'; return }
            document.getElementById('mc').innerHTML = `
<h1 class="page-title">Dashboard Overview</h1><p class="page-subtitle">BECE Social Learning Network — Class Performance Analytics</p>
<div class="stats-grid">
<div class="stat-card"><div class="stat-label">Class Average</div><div class="stat-value" style="color:${sc(d.class_average)}">${(d.class_average * 100).toFixed(1)}%</div><div class="stat-detail">Across all topics</div></div>
<div class="stat-card"><div class="stat-label">Students</div><div class="stat-value" style="color:var(--accent-blue)">${d.total_students}</div><div class="stat-detail">JSS3 students tracked</div></div>
<div class="stat-card"><div class="stat-label">Topics</div><div class="stat-value" style="color:var(--accent-purple)">${d.total_topics}</div><div class="stat-detail">Across 9 subjects</div></div>
<div class="stat-card"><div class="stat-label">Dependencies</div><div class="stat-value" style="color:var(--accent-cyan)">${d.topic_dependencies}</div><div class="stat-detail">Topic-topic links</div></div>
</div>
<div class="charts-grid">
<div class="chart-card"><div class="chart-title">Average Score by Subject</div>${barChart(d.subject_averages.map(s => ({ label: s.subject, value: s.average })))}</div>
<div class="chart-card"><div class="chart-title">5 Weakest Topics</div>${barChart(d.weakest_topics.map(t => ({ label: t.name, value: t.average })), () => 'var(--accent-red)')}</div>
</div>
<div class="table-card"><div class="table-header">Top 5 Struggling Students</div>
<table><thead><tr><th>Student ID</th><th>Profile</th><th>Average Score</th></tr></thead>
<tbody>${d.struggling_students.map(s => '<tr><td style="font-family:JetBrains Mono;font-weight:600">' + s.id + '</td><td>' + pb(s.profile) + '</td><td>' + sb(s.average) + '</td></tr>').join('')}</tbody></table></div>`
        }

        async function renderStudents() {
            const d = await api('/students'); if (!d) { document.getElementById('mc').innerHTML = '<div class="error-box">Cannot load students.</div>'; return }
            document.getElementById('mc').innerHTML = `<h1 class="page-title">Students</h1><p class="page-subtitle">${d.count} JSS3 students — click any row for details</p>
<div class="table-card"><table><thead><tr><th>ID</th><th>Profile</th><th>Average Score</th><th>Topics</th></tr></thead>
<tbody>${d.students.map(s => '<tr style="cursor:pointer" onclick="renderDetail(\'' + s.id + '\')"><td style="font-family:JetBrains Mono;font-weight:600">' + s.id + '</td><td>' + pb(s.profile) + '</td><td>' + sb(s.average_score) + '</td><td style="color:var(--text-muted)">' + s.topic_count + '</td></tr>').join('')}</tbody></table></div>`
        }

        async function renderDetail(id) {
            const d = await api('/students/' + id); if (!d) return; let rows = '';
            for (const [subj, scores] of Object.entries(d.scores_by_subject)) {
                const avg = scores.reduce((a, s) => a + s.score, 0) / scores.length;
                rows += '<tr style="background:var(--bg-secondary)"><td colspan="3" style="font-weight:700;color:var(--accent-blue);padding:14px 20px">' + subj + '<span style="float:right;font-family:JetBrains Mono;color:' + sc(avg) + '">avg ' + (avg * 100).toFixed(0) + '%</span></td></tr>';
                for (const s of scores) rows += '<tr><td style="padding-left:36px">' + s.topic_name + '</td><td>' + db(s.difficulty) + '</td><td>' + sb(s.score) + '</td></tr>'
            }
            document.getElementById('mc').innerHTML = `<h1 class="page-title"><span style="cursor:pointer;color:var(--text-muted)" onclick="renderStudents()">Students</span> <span style="color:var(--text-muted)">›</span> ${id}</h1>
<p class="page-subtitle">Profile: ${d.student.profile} — Average: ${(d.student.average_score * 100).toFixed(1)}%</p>
<div class="table-card"><table><thead><tr><th>Topic</th><th>Difficulty</th><th>Score</th></tr></thead><tbody>${rows}</tbody></table></div>`
        }

        async function renderTopics() {
            const d = await api('/topics'); if (!d) { document.getElementById('mc').innerHTML = '<div class="error-box">Cannot load topics.</div>'; return }
            document.getElementById('mc').innerHTML = `<h1 class="page-title">Topics</h1><p class="page-subtitle">${d.count} topics sorted by class average (weakest first)</p>
<div class="table-card"><table><thead><tr><th>ID</th><th>Topic</th><th>Subject</th><th>Difficulty</th><th>Class Average</th><th>Failing</th></tr></thead>
<tbody>${d.topics.map(t => '<tr><td style="font-family:JetBrains Mono;color:var(--text-muted);font-size:12px">' + t.id + '</td><td style="font-weight:500">' + t.name + '</td><td style="color:var(--text-secondary);font-size:12px">' + t.subject + '</td><td>' + db(t.difficulty) + '</td><td>' + sb(t.class_average) + '</td><td style="font-family:JetBrains Mono;color:' + (t.failing_count > 25 ? 'var(--accent-red)' : 'var(--text-secondary)') + '">' + t.failing_count + '/50</td></tr>').join('')}</tbody></table></div>`
        }

        async function renderPairs() {
            const d = await api('/complementary-pairs'); const pairs = d?.pairs || [];
            document.getElementById('mc').innerHTML = `<h1 class="page-title">Complementary Peer Pairs</h1><p class="page-subtitle">${pairs.length > 0 ? pairs.length + ' recommended pairs' : 'Run complementarity_analysis.py first'}</p>
${pairs.length > 0 ? pairs.map((p, i) => '<div class="pair-card"><div class="pair-rank">#' + (i + 1) + '</div><div class="pair-students"><span style="font-family:JetBrains Mono;font-weight:600;color:var(--accent-blue)">' + p.student_a + '</span><span style="color:var(--text-muted);margin:0 8px">↔</span><span style="font-family:JetBrains Mono;font-weight:600;color:var(--accent-green)">' + p.student_b + '</span><span style="margin-left:16px;font-size:12px;color:var(--text-muted)">correlation: ' + (p.correlation?.toFixed(4) || 'N/A') + '</span></div><div class="pair-score">' + ((p.complementarity_score || 0) * 100).toFixed(0) + '%</div></div>').join('') : '<div class="error-box">Run complementarity_analysis.py then restart the API.</div>'}`
        }

        async function renderGroups() {
            const d = await api('/peer-groups'); const groups = d?.groups || []; let metrics = '';
            if (d?.quality_metrics) { const m = d.quality_metrics; metrics = '<div class="stats-grid" style="margin-bottom:24px"><div class="stat-card"><div class="stat-label">Algorithm Score</div><div class="stat-value" style="color:var(--accent-green)">' + m.average_complementarity + '</div></div><div class="stat-card"><div class="stat-label">Random Baseline</div><div class="stat-value" style="color:var(--accent-red)">' + m.random_baseline + '</div></div><div class="stat-card"><div class="stat-label">Improvement</div><div class="stat-value" style="color:var(--accent-cyan)">' + m.vs_random_baseline + '</div></div></div>' }
            document.getElementById('mc').innerHTML = `<h1 class="page-title">Study Groups</h1><p class="page-subtitle">${groups.length > 0 ? groups.length + ' peer groups via AI clustering' : 'Waiting for ai_clustering.py'}</p>${metrics}
${groups.length > 0 ? groups.map(g => '<div class="group-card"><div class="group-card-header"><span class="group-id">' + g.group_id + '</span><span style="font-family:JetBrains Mono;color:' + sc(g.average_score) + ';font-weight:700">avg ' + (g.average_score * 100).toFixed(0) + '%</span></div><div class="group-members">' + g.members.map(m => '<span class="member-tag">' + m + '</span>').join('') + '</div><div class="group-meta"><strong style="color:var(--accent-green)">Strong:</strong> ' + g.strongest_subjects.join(', ') + ' &nbsp; <strong style="color:var(--accent-red)">Weak:</strong> ' + g.weakest_subjects.join(', ') + ' &nbsp; <strong style="color:var(--accent-purple)">Complementarity:</strong> ' + g.complementarity_score + '</div></div>').join('') : '<div class="error-box">Run ai_clustering.py to generate groups.</div>'}`
        }

        async function renderDependencies() {
            const d = await api('/topic-dependencies'); const deps = d?.dependencies || [];
            document.getElementById('mc').innerHTML = `<h1 class="page-title">Topic Dependencies</h1><p class="page-subtitle">${deps.length} dependencies — "If student fails A, likely fails B"</p>
<div class="table-card"><table><thead><tr><th>Topic A</th><th>Subject</th><th>Topic B</th><th>Subject</th><th>Correlation</th><th>Accuracy</th></tr></thead>
<tbody>${deps.map(d => '<tr><td style="font-weight:500">' + d.topic_a_name + '</td><td style="color:var(--text-muted);font-size:12px">' + d.topic_a_subject + '</td><td style="font-weight:500">' + d.topic_b_name + '</td><td style="color:var(--text-muted);font-size:12px">' + d.topic_b_subject + '</td><td style="font-family:JetBrains Mono;color:var(--accent-orange)">' + (d.correlation?.toFixed(4) || 'N/A') + '</td><td>' + (d.prediction_accuracy != null ? sb(d.prediction_accuracy) : '<span style="color:var(--text-muted)">N/A</span>') + '</td></tr>').join('')}</tbody></table></div>`
        }

        renderOverview();
    </script>
</body>

</html>
